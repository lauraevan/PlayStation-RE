name: Smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser scripts
        run: |
          node --check app.js
          node --check enhancements.js
          node --check experience.js
          node --check accuracy.js
          node --check ps5-focus.js
          node --check tools/fetch-artwork.mjs
      - name: Verify required files
        run: |
          test -s index.html
          test -s styles.css
          test -s fidelity.css
          test -s polish.css
          test -s accuracy.css
          test -s ps5-calibration.css
          test -s assets/gta-vi-logo.png
          test -s assets/gta-vi-cover.jpg
          test -s assets/gta-vi-hero.webp
          test -s assets/vice-city.svg
          test -s assets/source-catalog.json
          node -e "JSON.parse(require('fs').readFileSync('assets/source-catalog.json','utf8'))"
