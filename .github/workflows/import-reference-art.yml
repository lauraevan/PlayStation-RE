name: Import GTA VI artwork for static preview
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-reference-art.yml"
      - "scripts/import-reference-art.py"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install pillow
      - name: Import promotional images
        run: python scripts/import-reference-art.py
      - name: Commit files
        run: |
          git add assets/gta-vi-cover.jpg assets/gta-vi-logo.png assets/gta-vi-hero.webp assets/local-art.json assets/local-art.js 2>/dev/null || true
          git add assets/local-art.js
          if git diff --cached --quiet; then
            echo "No image assets were added."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bundle GTA VI promotional assets for offline static preview"
          git push
